[package]
name = "pedradb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embeddable persistent key-value store with multi-key ACID transactions"

[features]
default = []
# RFC-0018 P2.5: enable optional engine buggify hook bodies (still SeedRng-only).
buggify = []
# RFC-0051 P0: cooperative PCT turnstile hooks (maybe_yield) on the
# ConcurrentDb commit path; off ⇒ hooks compile away entirely.
pct = []

# Kani proof harnesses live in-tree under #[cfg(kani)] (bloom T1–T4).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
crc32c.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
bytes.workspace = true
tracing.workspace = true
lz4_flex.workspace = true
pedradb-posix.workspace = true

[dev-dependencies]
# Same production recover_kernel as collect_all (F4 / F14).
stateright = "0.31"

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "vlog_zipf"
harness = false

[[bench]]
name = "fsync_amortization"
harness = false

