[package]
name = "pedradb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PedraDB core LSM-tree storage engine (clean-room Rust reimplementation of RocksDB concepts)"

[features]
default = []
# RFC-0018 P2.5: enable optional engine buggify hook bodies (still SeedRng-only).
buggify = []

[dependencies]
crc32c.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
bytes.workspace = true
tracing.workspace = true
lz4_flex.workspace = true

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "vlog_zipf"
harness = false

[[example]]
name = "secondary_index"
path = "../../examples/secondary_index.rs"
