[package]
name = "pedradb-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Montanha-Store: multi-Raft range KV on PedraDB (substrate for DCS)"


[lib]
path = "src/lib_kernel.rs"
[[bin]]
name = "montanha-store-smoke"
path = "src/bin/montanha-store-smoke_kernel.rs"

[[bin]]
name = "montanha-tcp"
path = "src/bin/montanha-tcp_kernel.rs"

[[bin]]
name = "cluster_real"
path = "src/bin/cluster_real_kernel.rs"

[[bin]]
name = "montanha-perf-gate"
path = "src/bin/montanha-perf-gate_kernel.rs"

[[bin]]
name = "montanha-fdb-bench"
path = "src/bin/montanha-fdb-bench_kernel.rs"

[[bin]]
name = "montanha-fdb-compare"
path = "src/bin/montanha-fdb-compare_kernel.rs"

[[bin]]
name = "montanha-scale-gate"
path = "src/bin/montanha-scale-gate_kernel.rs"

[features]
default = []
tls = ["dep:rustls", "dep:rustls-pemfile"]

[dependencies]
pedradb-core.workspace = true
pedradb-io-uring.workspace = true
pedradb-dcs.workspace = true
bytes.workspace = true
crc32c.workspace = true
thiserror.workspace = true
rustls = { version = "0.21", optional = true }
rustls-pemfile = { version = "1.0", optional = true }

[dev-dependencies]
pedradb-raft.workspace = true
pedradb-sim.workspace = true
# Same production txn_kernel as apply / discard (RFC-0002 P9).
stateright = "0.31"
rcgen = "0.12"

[[test]]
name = "tcp_tls"
path = "tests/tcp_tls.rs"
required-features = ["tls"]
