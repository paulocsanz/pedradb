[package]
name = "pedradb-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FDB-shaped World runtime (RFC-0050): deterministic cluster sim over Montanha-Store, in-tree"

[[bin]]
name = "world_smoke"
path = "src/bin/world_smoke.rs"

[[bin]]
name = "world_soak"
path = "src/bin/world_soak.rs"

[[bin]]
name = "world_buggify_matrix"
path = "src/bin/world_buggify_matrix.rs"

[[bin]]
name = "world_shrink"
path = "src/bin/world_shrink.rs"

[[bin]]
name = "world_invariant_soak"
path = "src/bin/world_invariant_soak.rs"

[[bin]]
name = "world_partition_storm"
path = "src/bin/world_partition_storm.rs"

[[bin]]
name = "multiproc_trace_smoke"
path = "src/bin/multiproc_trace_smoke.rs"

[[bin]]
name = "world_hunt"
path = "src/bin/world_hunt.rs"

# RFC-0187 P0.1: exhaustive N≤3 concurrency gate (66-schedule space,
# per-schedule oracle, explored-count assertion, --selftest redness).
[[bin]]
name = "gate_exhaustive"
path = "src/bin/gate_exhaustive.rs"
required-features = ["pct"]

# RFC-0187 P0.2: versioned PCT seed ratchet (replay-all, fail-on-shrink,
# pinned outcomes + schedule hashes, --selftest redness).
[[bin]]
name = "gate_seed_ratchet"
path = "src/bin/gate_seed_ratchet.rs"
required-features = ["pct"]

# RFC-0187 P0.3: exhaustive crash-injection gate (measured op count,
# fail-closed recovery oracle, CRC corruption phase, --selftest redness).
[[bin]]
name = "gate_crash_injection"
path = "src/bin/gate_crash_injection.rs"
required-features = ["pct"]

# RFC-0187 P1.1: interleaving coverage floor (pinned-seed World campaign
# union vs versioned floor, --selftest redness).
[[bin]]
name = "gate_coverage_floor"
path = "src/bin/gate_coverage_floor.rs"

[features]
# RFC-0051 P0: PCT runner over the real ConcurrentDb (enables core hooks).
pct = ["pedradb-core/pct"]

[dependencies]
pedradb-core.workspace = true
pedradb-fold.workspace = true
pedradb-io-uring.workspace = true
pedradb-sim.workspace = true
pedradb-store.workspace = true
thiserror.workspace = true

[dev-dependencies]
bytes.workspace = true
pedradb-journal.workspace = true
pedradb-index.workspace = true
