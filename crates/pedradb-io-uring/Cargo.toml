[package]
name = "pedradb-io-uring"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux io_uring Env for PedraDB (WAL/SST write + fsync); POSIX fallback elsewhere"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
documentation = "https://docs.rs/pedradb-io-uring"
keywords = ["io-uring", "linux", "storage", "database", "fsync"]
categories = ["asynchronous", "database-implementations", "os::linux-apis"]

[dependencies]
pedradb-core.workspace = true
pedradb-posix.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
pedradb-sim.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
