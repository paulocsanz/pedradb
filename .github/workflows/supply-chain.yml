# RFC-0015 P2.3 — advisories gate
name: supply-chain

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly Monday 06:00 UTC — catch new RUSTSEC advisories
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  cargo-deny:
    name: cargo deny check advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --all-features

  unsafe-surface:
    name: unsafe allowlist (posix / io-uring / capi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: unsafe-surface
        run: bash scripts/unsafe-surface.sh

  miri-unsafe-islands:
    name: miri posix + cqe_kernel + handles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: cargo miri setup
        run: cargo +nightly miri setup
      - name: miri-unsafe-islands
        env:
          MIRI_REQUIRED: "1"
        run: bash scripts/miri-unsafe-islands.sh

  # RFC-0057 P1 / RFC-0059 P1.2 — FailingEnv durability oracles under
  # Miri (sibling of miri-unsafe-islands; never combined with TSan/PCT
  # in one process).
  miri-dst-smoke:
    name: miri FailingEnv DST smoke (RFC-0057 P1 / 0059 P1.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: cargo miri setup
        run: cargo +nightly miri setup
      - name: miri-dst-smoke
        env:
          MIRI_REQUIRED: "1"
        run: bash scripts/miri_dst_smoke.sh

  capi-asan-harness:
    name: C ABI C+ASan harness (in-process product gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: capi-asan
        env:
          ASAN_REQUIRED: "1"
        run: bash scripts/capi-asan.sh

  io-uring-linux-soak:
    name: io_uring live ring soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: pedradb-io-uring (live io_uring)
        env:
          URING_SOAK_REQUIRED: "1"
        run: bash scripts/io_uring_linux_soak.sh
