# CI: build + test suite (hard fail) in one job; formal glue lint and
# public hygiene in independent jobs with their own budgets.
#
# Tests: any failure is red. Lint: drift FAIL is red; classification debt
# is held at a ceiling (growth is red). Lean extracts are not built here
# on purpose: lake + mathlib takes about an hour;
# scripts/lean_extracts.sh --required covers it locally.
#
# The lint and hygiene jobs do NOT compile Rust: they run in seconds in
# their own job so a long test build can never starve them out of the
# workflow timeout (the "dead ratchet" failure mode: five consecutive
# cancelled runs with the lint step never reached, 2026-10-01..02).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build test suite
        run: cargo test -q -p pedradb-core --lib --no-run
      - name: Run tests
        run: cargo test -q -p pedradb-core --lib 2>&1 | tee test.log
      - name: Run compat oracle + adversarial suites
        run: cargo test -q -p rocksdb-compat --tests 2>&1 | tee -a test.log
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-logs
          path: test.log

  formal-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Formal glue lint (drift = fail; debt ceiling 0, realigned 2026-10-03)
        run: |
          set +e
          python3 scripts/formal/pedra_formal.py --lint > lint.log 2>&1
          python3 scripts/ci_ratchet.py lint lint.log 0
      - name: Upload lint log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-lint-log
          path: lint.log

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Public-mirror hygiene (manifest surface, no internal docs, no dangling internal links)
        run: python3 scripts/check_public_hygiene.py
      - name: Cross-references (every named script must exist)
        run: python3 scripts/check_xrefs.py
