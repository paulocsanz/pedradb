# CI: build + test suite (hard fail) + formal glue lint.
#
# Tests: any failure is red. Lint: drift FAIL is red; classification debt
# is held at a ceiling (growth is red). Lean extracts are not built here
# on purpose: lake + mathlib takes about an hour;
# scripts/lean_extracts.sh --required covers it locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build test suite
        run: cargo test -q -p pedradb-core --lib --no-run
      - name: Run tests
        run: cargo test -q -p pedradb-core --lib
      - name: Formal glue lint (drift = fail; debt ceiling 107)
        run: |
          set +e
          python3 scripts/formal/pedra_formal.py --lint > lint.log 2>&1
          python3 scripts/ci_ratchet.py lint lint.log 107
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            test.log
            lint.log
