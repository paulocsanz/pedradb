# RFC-0166 — proof-check: the machine-checked corpus.
# Every Verus twin proves (0 errors) and every Kani harness on a
# production kernel verifies, with both tools pinned by sha256. A proof
# regression is a build regression: this job failing means a theorem,
# twin, or harness broke.
#
# The repo default branch is a WIP branch, and GitHub only arms
# `schedule`/`workflow_dispatch` from the default branch — so the gate
# also runs on every push to main. The nightly cron takes over when
# this workflow reaches the default branch.
name: proof-check

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: proof-check-${{ github.ref }}
  cancel-in-progress: true

env:
  VERUS_VERSION: 0.2026.08.09.92f466f
  # sha256 of verus-0.2026.08.09.92f466f-x86-linux.zip from the release
  # (the same build the local corpus was proven with).
  VERUS_SHA256: 2f5a41c553f424aacdd732339e9d125563716a0b003c27730f75d6f81a282cef

jobs:
  verus-corpus:
    name: every twin proves (pinned verus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install pinned verus
        run: |
          # the pinned verus release is a rustup shim: it needs its exact
          # toolchain (also pinned by the release) present
          rustup toolchain install 1.97.1-x86_64-unknown-linux-gnu
          curl -sSfL -o verus.zip "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          echo "${VERUS_SHA256}  verus.zip" | sha256sum -c -
          unzip -q verus.zip
          VERUS_DIR="$(find . -maxdepth 1 -type d -name 'verus-*' | head -1)"
          test -n "${VERUS_DIR}" && test -x "${VERUS_DIR}/verus"
          echo "${PWD}/${VERUS_DIR}" >> "${GITHUB_PATH}"
          "${VERUS_DIR}/verus" --version
      - name: every scripts/verus_*.sh exits 0 (0 errors each)
        run: |
          status=0
          for sh in scripts/verus_*.sh; do
            echo "::group::${sh}"
            if ! bash "${sh}"; then
              echo "::error::${sh} failed (twin drifted or proof broke)"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

  kani-harnesses:
    name: kani harnesses on production kernels (pinned kani)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # kani-github-action v1.1, pinned by commit sha; kani itself pinned
      # by version (the action verifies its sha on install)
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: 0.67.0
          args: -p pedradb-core
