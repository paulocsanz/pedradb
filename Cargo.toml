[workspace]
resolver = "2"
members = [
    "crates/pedradb-posix",
    "crates/pedradb-core",
    "crates/pedradb-sim",
    "crates/pedradb-spec",
    "crates/pedradb-io-uring",
    "crates/pedradb-ops",
    "crates/rocksdb-compat",
    "crates/rocksdb-parity-bench",
    "examples",
]
exclude = [
    "formal/aeneas/vote-kernel",
    "formal/aeneas/isolated-kernel",
    "formal/aeneas/ae-kernel",
    "formal/aeneas/commit-kernel",
    "formal/aeneas/bloom-kernel",
    "bench/sub-surreal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(verus_keep_ghost)', 'cfg(loom)', 'cfg(pedra_aeneas)'] }

[workspace.dependencies]
# Internal
pedradb-posix = { path = "crates/pedradb-posix" }
pedradb-core = { path = "crates/pedradb-core" }
pedradb-spec = { path = "crates/pedradb-spec" }
pedradb-sim = { path = "crates/pedradb-sim" }
pedradb-io-uring = { path = "crates/pedradb-io-uring" }
pedradb-ops = { path = "crates/pedradb-ops" }

# Shared
crc32c = "0.6"
thiserror = "1"
parking_lot = "0.12"
bytes = "1"
tracing = "0.1"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
