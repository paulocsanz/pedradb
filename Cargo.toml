[workspace]
resolver = "2"
members = [
    "crates/pedradb-posix",
    "crates/pedradb-core",
    "crates/pedradb-sim",
    "crates/pedradb-oracle",
    "crates/pedradb-cli",
    "crates/pedradb-apply",
    "crates/pedradb-replicate",
    "crates/pedradb-raft",
    "crates/pedradb-dcs",
    "crates/pedradb-sql",
    "crates/pedradb-stream",
    "crates/pedradb-http",
    "crates/pedradb-dst",
    "crates/pedradb-store",
    "crates/pedradb-io-uring",
    "crates/pedradb-ops",
    "crates/pedradb-lease",
    "crates/pedradb-index",
    "crates/pedradb-journal",
    "crates/pedradb-fold",
    "crates/montanha-fdb-recipes",
    "crates/rocksdb-compat",
    "crates/rocksdb-compat-alias-smoke",
    "crates/rocksdb-parity-bench",
]
exclude = ["formal/aeneas/vote-kernel", "formal/aeneas/isolated-kernel"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Internal
pedradb-posix = { path = "crates/pedradb-posix" }
pedradb-core = { path = "crates/pedradb-core" }
pedradb-sim = { path = "crates/pedradb-sim" }
pedradb-oracle = { path = "crates/pedradb-oracle" }
pedradb-apply = { path = "crates/pedradb-apply" }
pedradb-replicate = { path = "crates/pedradb-replicate" }
pedradb-raft = { path = "crates/pedradb-raft" }
pedradb-dcs = { path = "crates/pedradb-dcs" }
pedradb-sql = { path = "crates/pedradb-sql" }
pedradb-stream = { path = "crates/pedradb-stream" }
pedradb-http = { path = "crates/pedradb-http" }
pedradb-dst = { path = "crates/pedradb-dst" }
pedradb-store = { path = "crates/pedradb-store" }
pedradb-io-uring = { path = "crates/pedradb-io-uring" }
pedradb-ops = { path = "crates/pedradb-ops" }
pedradb-lease = { path = "crates/pedradb-lease" }
pedradb-index = { path = "crates/pedradb-index" }
pedradb-journal = { path = "crates/pedradb-journal" }
pedradb-fold = { path = "crates/pedradb-fold" }
montanha-fdb-recipes = { path = "crates/montanha-fdb-recipes" }

# Shared
crc32c = "0.6"
thiserror = "1"
parking_lot = "0.12"
bytes = "1"
tracing = "0.1"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
